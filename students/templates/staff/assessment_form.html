{% extends 'staff/base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block title %}{{ title }} | Staff Console{% endblock %}

{% block content %}
  <div class="max-w-2xl rounded-2xl border border-[#262322]/10 bg-white p-6 shadow-sm md:p-8">
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="grid gap-5 sm:grid-cols-2">
        {% for field in form %}
          <div class="{% if field.name in 'student,subject,topics,tutor_notes' %}sm:col-span-2{% endif %}">
            <label class="block text-sm font-semibold text-[#262322]">
              {{ field.label }}
              {{ field }}
            </label>
            {% if field.errors %}
              <p class="mt-1 text-sm font-medium text-[#E63946]" role="alert">{{ field.errors.0 }}</p>
            {% endif %}
          </div>
        {% endfor %}
      </div>
      <div class="mt-7 flex items-center gap-3">
        <button class="rounded-full bg-[#36827F] px-6 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-[#2a5f5d]">
          Save assessment
        </button>
        <a href="{% if assessment %}{% url 'staff_student_assessments' assessment.student_id %}{% else %}{% url 'staff_assessment_list' %}{% endif %}" class="rounded-full border border-[#262322]/15 px-6 py-3 text-sm font-bold text-[#262322] transition hover:bg-[#F2E5D7]">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
