<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#F2E5D7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2E5D7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#2a5f5d;padding:24px 32px;">
              <h1 style="margin:0;color:#ffffff;font-size:20px;">Reset your password</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px;color:#262322;font-size:15px;line-height:1.6;">Hello, we received a request to reset the password for your Slough Tuition Centre account.</p>
              <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                 style="display:inline-block;background:#36827F;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 24px;border-radius:999px;font-size:15px;">
                Choose a new password
              </a>
              <p style="margin:24px 0 0;color:#5b5855;font-size:13px;line-height:1.6;">This link is only valid for a short time. If you didn't ask to reset your password, you can ignore this email — your password won't change.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#F7EFE4;padding:16px 32px;">
              <p style="margin:0;color:#8a837e;font-size:12px;">Slough Tuition Centre</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
