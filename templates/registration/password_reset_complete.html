{% extends 'base.html' %}

{% block title %}Password changed | Slough Tuition Center{% endblock %}

{% block content %}
<main class="flex min-h-[70vh] items-center justify-center px-6 py-16">
  <div class="w-full max-w-md">
    <div class="rounded-3xl border border-[#262322]/10 bg-white p-8 text-center shadow-2xl">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-100 text-2xl">✓</div>
      <h1 class="mt-4 text-2xl font-black text-[#262322]">Password changed</h1>
      <p class="mt-2 text-sm text-[#262322]/60">Your password has been updated. You can now log in with your new password.</p>
      <a href="{% url 'login' %}" class="mt-6 inline-block rounded-full bg-[#36827F] px-6 py-3 font-bold text-white transition hover:bg-[#2a5f5d]">Log in</a>
    </div>
  </div>
</main>
{% endblock %}
